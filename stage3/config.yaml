# Stage 3: one report -> one of the dataset's mutually-exclusive classes. No teacher.
max_len: 512
head_tokens: 384                # first 384 + last 126 tokens for reports longer than 510
pooling: attn                   # attn (learned token weights) | mean | cls
dropout: 0.1
seed: 42
tokenizer: bert-base-uncased

# Pretrained Stage 3 runs use query/value LoRA. The random-init ablation automatically disables LoRA
# and trains the full encoder, so a randomly initialized encoder is never frozen.
use_lora: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: [query, value]

head_lr: 1.0e-3                 # classifier and attentive pooler; LoRA uses args.learning_rate
class_weight: sqrt_inv          # null | sqrt_inv; optional help for imbalanced classes
early_stopping_patience: 4

student:                        # only used when --init random (ablation A)
  vocab_size: 30522
  hidden_size: 256
  num_layers: 4
  num_heads: 4
  intermediate_size: 1024
  max_positions: 512

# Passed straight to transformers.TrainingArguments (tailored for RTX 3050 6 GB VRAM on Windows).
args:
  per_device_train_batch_size: 16     # micro-batch to reduce 512-token activation memory on a 6 GB GPU
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 4      # effective batch = 16 * 4 = 64
  num_train_epochs: 25
  learning_rate: 3.0e-4           # base encoder / LoRA rate
  lr_scheduler_type: linear
  warmup_ratio: 0.06
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true                          # RTX 3050 Ampere hardware bf16
  dataloader_num_workers: 0           # Windows stability (avoids multiprocessing memory duplication)
  logging_steps: 50
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: macro_f1
  greater_is_better: true
